  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>

    <!--
      Netlify Forms detection form.
      Netlify's build bot only scans the raw, pre-JS HTML for forms, so this
      static twin of ContactForm.jsx is what registers the "contact" form in
      the Netlify dashboard and turns on spam filtering / notifications.
      It is never shown to visitors (hidden) and never submitted directly —
      the real React form in ContactForm.jsx posts to "/" with the same
      field names and form-name value.
    -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
